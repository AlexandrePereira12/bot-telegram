# Proxy do deployment. Em producao, o TLS termina aqui (certificado montado
# no host) e todo HTTP redireciona para HTTPS.
#
# Resolucao de nome: o DNS interno do Docker (127.0.0.11) e consultado a cada
# request porque o destino esta numa variavel. Com `upstream` fixo, o Nginx
# resolveria `api` uma unica vez no start e continuaria batendo no IP antigo
# depois de qualquer `docker compose up -d api` — devolvendo 502 ate alguem
# reiniciar o proxy.
resolver 127.0.0.11 valid=10s ipv6=off;

# Limites de borda, complementares ao rate limit da aplicacao.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # Padrao do nginx para limite excedido e 503; 429 e o codigo correto e
    # o que o cliente da API ja trata.
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Variaveis, nao blocos `upstream`: e o que forca a reresolucao do DNS.
    set $api_backend "api:8000";
    set $web_backend "frontend:80";

    location /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://$api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    # Upload de midia do funil: o limite global de 2m nao serve para video.
    location /api/v1/content/media {
        limit_req zone=api_zone burst=10 nodelay;
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://$api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://$api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location = /health {
        proxy_pass http://$api_backend/health;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location = /ready {
        proxy_pass http://$api_backend/ready;
        include /etc/nginx/proxy_params_custom.conf;
    }

    # /metrics NAO e exposto aqui.
    #
    # Um allowlist por IP nesta camada nao protege: atras do Docker todo
    # cliente externo chega com o endereco da rede bridge (172.16/12), entao
    # a regra liberaria a internet inteira. O Prometheus faz scrape direto no
    # container `api` pela rede interna do compose (api:8000/metrics), que
    # nunca e publicada.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://$web_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }
}

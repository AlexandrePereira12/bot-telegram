[project]
name = "traffic-bot"
version = "0.1.0"
description = "Bot de trafego pago Telegram + CRM + dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "httpx>=0.28.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # tmp dir em fixture de teste
"app/api/routes/*" = ["B008"]  # Depends/Query no default e o padrao do FastAPI
"app/schemas/__init__.py" = ["S105"]  # "bearer" e o tipo do token, nao uma senha

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

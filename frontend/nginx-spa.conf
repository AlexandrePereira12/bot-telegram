server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota do React Router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
